name: Release binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: auto
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Test
        run: go test ./... -count=1
        env:
          GOTOOLCHAIN: auto

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          GOTOOLCHAIN: auto
        run: |
          mkdir -p dist/package
          suffix=""
          if [ "$GOOS" = "windows" ]; then suffix=".exe"; fi
          version="${GITHUB_REF_NAME#v}"
          go build -trimpath -ldflags="-s -w -X github.com/oovz/mcp-json-reader/v2/internal/mcpserver.Version=${version}" -o "dist/package/mcp-json-reader${suffix}" ./cmd/mcp-json-reader
          cp README.md LICENSE "dist/package/"

      - name: Archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          name="mcp-json-reader_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          if [ "$ARCHIVE" = "zip" ]; then
            (cd dist/package && zip -r "../${name}.zip" .)
          else
            tar -C dist/package -czf "dist/${name}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: mcp-json-reader-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag

  verify-module:
    name: Verify Go module
    needs: release
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Verify go install works against the published tag
        env:
          GOTOOLCHAIN: auto
        run: |
          # The Go module proxy may take a few seconds to index the new tag.
          # Poll until the version is available.
          version="${GITHUB_REF_NAME}"
          for i in $(seq 1 12); do
            if go list -m "github.com/oovz/mcp-json-reader/v2@${version}" 2>/dev/null; then
              echo "Module version ${version} is available on the proxy."
              break
            fi
            echo "Waiting for proxy to index ${version}... (attempt $i/12)"
            sleep 10
          done

          go install "github.com/oovz/mcp-json-reader/v2/cmd/mcp-json-reader@${version}"
          installed_version="$(mcp-json-reader --version)"
          expected_version="${version#v}"
          echo "Installed: ${installed_version}"
          echo "Expected:  mcp-json-reader ${expected_version}"
          if [ "${installed_version}" != "mcp-json-reader ${expected_version}" ]; then
            echo "::error::Installed version does not match tag"
            exit 1
          fi
