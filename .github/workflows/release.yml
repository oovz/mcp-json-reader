name: Release npm package

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Show release toolchain versions
        run: node --version && npm --version
      - name: Build native binaries and pack for npm
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          node -e 'for (const t of require("./cli/targets.js").TARGETS) console.log(t.goos, t.goarch, t.directory, t.file)' > "$RUNNER_TEMP/targets"
          while read -r goos goarch directory file; do
            mkdir -p "cli/binaries/$directory"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X github.com/oovz/mcp-json-reader/v3/internal/mcpserver.Version=$version" \
              -o "cli/binaries/$directory/$file" ./cmd/mcp-json-reader
          done < "$RUNNER_TEMP/targets"
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - name: Test installed command at the supported runtime floor
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          npm install --offline --ignore-scripts --no-audit --no-package-lock \
            --prefix "$RUNNER_TEMP/install" "$RUNNER_TEMP"/npm/*.tgz
          npm exec --offline --prefix "$RUNNER_TEMP/install" -- mcp-json-reader --version
          node cli/smoke-installed.js "$RUNNER_TEMP/install/node_modules/mcp-json-reader/cli/mcp-json-reader.js"

  publish:
    needs: [build, smoke]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Show release toolchain versions
        run: node --version && npm --version
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - name: Publish the tested npm package
        shell: bash
        run: npm publish "$RUNNER_TEMP"/npm/*.tgz --provenance

  github-release:
    needs: publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Create GitHub Release with commits since the previous version tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git describe --tags --match='v[0-9]*.[0-9]*.[0-9]*' --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ -n "$previous_tag" ]]; then
            printf 'Commits since %s:\n\n' "$previous_tag" > "$notes_file"
            git log --reverse \
              --format="- [%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H) %s" \
              "$previous_tag..$TAG" >> "$notes_file"
          else
            printf 'Commits in this release:\n\n' > "$notes_file"
            git log --reverse \
              --format="- [%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H) %s" \
              "$TAG" >> "$notes_file"
          fi
          if [[ "$(wc -l < "$notes_file")" -le 2 ]]; then
            printf 'No commits found.\n' >> "$notes_file"
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$notes_file"
