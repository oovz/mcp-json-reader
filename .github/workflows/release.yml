name: Release packages and binaries

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  build:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Show release toolchain versions
        run: node --version && npm --version
      - name: Build native binaries and pack for npm
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          node -e 'for (const t of require("./cli/targets.js").TARGETS) console.log(t.goos, t.goarch, t.directory, t.file)' > "$RUNNER_TEMP/targets"
          while read -r goos goarch directory file; do
            mkdir -p "cli/binaries/$directory"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X github.com/oovz/mcp-json-reader/v3/internal/mcpserver.Version=$version" \
              -o "cli/binaries/$directory/$file" ./cmd/mcp-json-reader
          done < "$RUNNER_TEMP/targets"
          mkdir -p "$RUNNER_TEMP/npm"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
      - name: Prepare standalone binaries and checksums
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir -p "$RUNNER_TEMP/native"
          while read -r goos goarch directory file; do
            binary="$RUNNER_TEMP/native/mcp-json-reader_${version}_${goos}_${goarch}"
            if [[ "$goos" == windows ]]; then binary+=.exe; fi
            cp "cli/binaries/$directory/$file" "$binary"
          done < "$RUNNER_TEMP/targets"
          cp LICENSE "$RUNNER_TEMP/native/LICENSE"
          (cd "$RUNNER_TEMP/native" && sha256sum mcp-json-reader_* LICENSE > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-binaries
          path: ${{ runner.temp }}/native/*
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: windows-2025
            arch: x64
          - runner: windows-11-arm
            arch: arm64
          - runner: macos-15-intel
            arch: x64
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
          package-manager-cache: false
      - run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - name: Test installed command at the supported runtime floor
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(node -p 'process.arch')" = "$EXPECTED_ARCH"
          npm install --offline --ignore-scripts --no-audit --no-package-lock \
            --prefix "$RUNNER_TEMP/install" "$RUNNER_TEMP"/npm/*.tgz
          npm exec --offline --prefix "$RUNNER_TEMP/install" -- mcp-json-reader --version
          node cli/smoke-installed.js "$RUNNER_TEMP/install/node_modules/mcp-json-reader/cli/mcp-json-reader.js"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-binaries
          path: ${{ runner.temp }}/native
      - name: Test the standalone binary
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          read -r goos goarch < <(node -e 'const t = require("./cli/targets.js").targetFor(process.platform, process.arch); console.log(t.goos, t.goarch)')
          export NATIVE_BINARY="$RUNNER_TEMP/native/mcp-json-reader_${version}_${goos}_${goarch}"
          if [[ "$RUNNER_OS" == Windows ]]; then NATIVE_BINARY+=.exe; fi
          node -e '
            const fs = require("node:fs"), path = require("node:path"), crypto = require("node:crypto"), assert = require("node:assert/strict");
            const binary = process.env.NATIVE_BINARY;
            const line = fs.readFileSync(path.join(path.dirname(binary), "SHA256SUMS"), "utf8").split("\n").find(line => line.endsWith("  " + path.basename(binary)));
            assert.ok(line, "binary checksum is missing");
            assert.equal(crypto.createHash("sha256").update(fs.readFileSync(binary)).digest("hex"), line.split("  ")[0]);
          '
          if [[ "$RUNNER_OS" != Windows ]]; then chmod +x "$NATIVE_BINARY"; fi
          "$NATIVE_BINARY" --version
          node cli/smoke-installed.js --native "$NATIVE_BINARY"

  publish:
    needs: [build, smoke]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Show release toolchain versions
        run: node --version && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm
      - name: Publish the tested npm package
        shell: bash
        run: npm publish "$RUNNER_TEMP"/npm/*.tgz --provenance

  github-release:
    needs: publish
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-binaries
          path: ${{ runner.temp }}/native
      - name: Create GitHub Release with commits since the previous published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty')"
          notes_file="$RUNNER_TEMP/release-notes.md"
          if [[ -n "$previous_tag" ]]; then
            printf '[Compare %s...%s](%s/%s/compare/%s...%s)\n\nCommits since %s:\n\n' \
              "$previous_tag" "$TAG" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" \
              "$previous_tag" "$TAG" "$previous_tag" > "$notes_file"
            git log --reverse \
              --format="- [%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H) %s" \
              "$previous_tag..$TAG" >> "$notes_file"
          else
            printf 'Commits in this release:\n\n' > "$notes_file"
            git log --reverse \
              --format="- [%h]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/%H) %s" \
              "$TAG" >> "$notes_file"
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$notes_file" \
            "$RUNNER_TEMP"/native/mcp-json-reader_* "$RUNNER_TEMP/native/SHA256SUMS" "$RUNNER_TEMP/native/LICENSE"
